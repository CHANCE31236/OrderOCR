[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "order-paper-ocr"
version = "1.1.0"
description = "Delivery-note OCR, manual review, and Excel export desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.7,<7",
  "opencv-python>=4.10,<6",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "openai>=1.109,<3",
  "python-dotenv>=1.0,<2",
  "keyring>=25.4,<26",
  "rapidocr-onnxruntime>=1.4.4,<2",
  "onnxruntime>=1.18,<2",
  "tenacity>=9,<10",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
