name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test and scan
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/check_no_secrets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build one-file Windows executable
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "订单纸单识别器" --icon assets/app.ico
          --add-data "config;config" --add-data "assets;assets"
          --collect-all rapidocr_onnxruntime
          --hidden-import keyring.backends.Windows main.py

      - name: Test packaged OCR runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\订单纸单识别器.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }

      - name: Create release archive
        shell: pwsh
        run: |
          $stage = "release\OrderOCR-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist\订单纸单识别器.exe" $stage
          Copy-Item -Recurse config,assets $stage
          Copy-Item README.md,CHANGELOG.md,.env.example $stage
          $archive = Join-Path $PWD "release\OrderOCR-Windows-x64.zip"
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $stage).Path,
            $archive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: OrderOCR-Windows-x64
          path: release/OrderOCR-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/OrderOCR-Windows-x64.zip
          generate_release_notes: true
